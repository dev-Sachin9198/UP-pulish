<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Login | UPPRPB</title>

  <link
    rel="icon"
    type="image/png"
    href="/Logo/UP_P_Logo.png"
  >

  <link
    rel="stylesheet"
    href="./Account.css"
  >
</head>

<body>



  <header class="site-header">

    <!-- Header Controls -->
    <div class="header-controls">

      <button
        type="button"
        class="home-btn"
        id="homeBtn"
      >
        Home
      </button>


      <div
        class="font-size-toggle"
        role="group"
        aria-label="Text size controls"
      >

        <button type="button" data-size="dec2">
          A--
        </button>

        <button type="button" data-size="dec">
          A-
        </button>

        <button
          type="button"
          data-size="reset"
          class="active"
        >
          A
        </button>

        <button type="button" data-size="inc">
          A+
        </button>

        <button type="button" data-size="inc2">
          A++
        </button>

      </div>

    </div>


    <!-- Logo + Title -->

    <div class="header-top">

      <div class="logo-slot">
        <img
          src="/Logo/UP_P_Logo.png"
          alt="UP Police Logo"
        >
      </div>


      <div class="header-title">

        <h1 class="title-primary">
          उत्तर प्रदेश पुलिस भर्ती एवं प्रोन्नति बोर्ड
        </h1>

        <h2 class="title-secondary">
          UTTAR PRADESH POLICE RECRUITMENT AND PROMOTION BOARD
        </h2>

      </div>


      <div class="logo-slot">
        <img
          src="/Logo/UPPRPB_Logo.png"
          alt="UP Police Logo"
        >
      </div>

    </div>

  </header>
  <h1 style="text-align: center;">Development This PAge</h1>
  
</body>
</html>
